spring.application.name=auth-experiment

# H2 Database configuration for persistent storage
spring.datasource.url=jdbc:h2:file:./data/auth_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=cb7978cd5128a3a557b08d5be8330584d27f08baa9420b0bf3b226e50a616800
jwt.expiration=3600000
jwt.refresh.expiration=86400000
